name: 发布脚本执行

# 触发方式：仅支持本仓库 Actions 页「Run workflow」手动运行。
# 语义：仓库机密 PUBLISH 存有一段 bash 发布脚本；本工作流把该机密落盘后执行。
# 说明：
#   - 签出私有 MisakaStudy 代码（经 secrets.PAT），脚本工作目录即其仓库根。
#   - PUBLISH 内容属于机密：只经环境变量透传给步骤，绝不明文写入命令/日志。
#   - 安全红线（公开仓库）：仅允许 workflow_dispatch，不配置 push / pull_request 触发。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要签出的 MisakaStudy 分支或 commit
        required: false
        default: "next"
        type: string
      args:
        description: 追加传给 PUBLISH 脚本的位置参数（可空）
        required: false
        default: ""
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: 执行 PUBLISH 脚本
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PAT }}

      - name: 运行 PUBLISH 脚本
        env:
          PUBLISH_SCRIPT: ${{ secrets.PUBLISH }}
          PUBLISH_REF: ${{ inputs.ref }}
          PUBLISH_ARGS: ${{ inputs.args }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail

          [ -n "$PUBLISH_SCRIPT" ] || { echo "未找到机密 PUBLISH，请先在仓库 Settings → Secrets 配置后重试"; exit 1; }

          SCRIPT="$RUNNER_TEMP/publish.sh"
          # PUBLISH 是一整段 bash 脚本：原样落盘再执行，避免把机密展开进命令行（防注入/防泄漏）。
          # 顺带去掉粘贴可能带入的 CR，保证 \r 不会混进脚本。
          printf '%s\n' "$PUBLISH_SCRIPT" | sed 's/\r$//' > "$SCRIPT"
          chmod +x "$SCRIPT"

          echo "工作区为 MisakaStudy@${PUBLISH_REF}，开始执行 PUBLISH 脚本…"

          if [ -n "$PUBLISH_ARGS" ]; then
            read -r -a ARGV <<< "$PUBLISH_ARGS"
            bash "$SCRIPT" "${ARGV[@]}"
          else
            bash "$SCRIPT"
          fi
