name: 诊断 PAT

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断 PAT
    runs-on: ubuntu-24.04
    steps:
      - name: 检查 PAT 是否为空
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          echo "PAT 长度: ${#PAT}"
          if [ -z "$PAT" ]; then echo "PAT 为空值"; else echo "PAT 非空"; fi

      - name: 用 PAT 访问 MisakaStudy
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          echo "--- 读取 MisakaStudy 元数据 ---"
          gh api repos/YangRucheng/MisakaStudy --jq '{full_name, private, visibility}' || echo "访问 MisakaStudy 失败 exit=$?"
          echo "--- 当前 PAT 用户 ---"
          gh api user --jq .login || echo "gh api user 失败"
