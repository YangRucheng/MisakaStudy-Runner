name: 小程序端镜像构建

# 由 MisakaStudy 仓库 trigger.yml 经 repository_dispatch(misaka_push) 触发，仅在 miniprogram/** 变更时构建；
# 也可在 Runner 仓库手动触发（workflow_dispatch，构建本镜像）。
on:
  repository_dispatch:
    types: [misaka_push]
  workflow_dispatch:

concurrency:
  group: docker-build-miniprogram
  cancel-in-progress: false

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      miniprogram: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.miniprogram == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        if: github.event_name == 'repository_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            miniprogram:
              - 'miniprogram/**'

  build:
    name: 构建并推送小程序镜像
    needs: detect
    if: needs.detect.outputs.miniprogram == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 生成构建参数
        id: meta
        run: |
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "version=v4.$(TZ=Asia/Shanghai date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./miniprogram
          file: ./miniprogram/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:miniprogram
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            TIMESTAMP=${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha,scope=miniprogram
          cache-to: type=gha,mode=max,scope=miniprogram
