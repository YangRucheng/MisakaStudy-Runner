name: 测试

# 由 MisakaStudy 仓库的 trigger.yml 通过 repository_dispatch 触发（PR 事件）
# 检出 MisakaStudy 对应 commit 执行测试，并把聚合状态回写到该 commit
on:
  repository_dispatch:
    types: [misaka_pr]

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' }}
      task: ${{ steps.filter.outputs.task == 'true' }}
      edge_apis: ${{ steps.filter.outputs.edge_apis == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            server:
              - 'server/**'
            task:
              - 'task/**'
            edge_apis:
              - 'edge/apis/**'

  server-tests:
    name: 服务端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    env:
      # faceToken 在线接口测试使用的测试账号（Runner 仓库 secrets）
      CX_USERNAME: ${{ secrets.CX_USERNAME }}
      CX_PASSWORD: ${{ secrets.CX_PASSWORD }}

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff 代码检查
        run: ruff check src/

      - name: Pytest 接口测试
        # 仅运行无需外部环境的测试（路由黄金测试 + 单元测试）；E2E 由 e2e-tests.yml 承担
        run: >-
          pytest tests/test_routes.py tests/test_feishu.py tests/test_scheduler.py
          tests/test_user_service.py tests/test_weixin.py -v

      - name: Pytest 在线接口测试（faceToken）
        # 用 CX_USERNAME/CX_PASSWORD 登录超星并验证 faceToken 接口；隐私红线：
        # 仅允许输出 /pptSign/check-face-result 响应，其余接口数据一律不落日志。
        run: |
          if [ -f tests/test_chaoxing_face_token.py ]; then
            pytest tests/test_chaoxing_face_token.py -v
          else
            echo "未找到 tests/test_chaoxing_face_token.py，跳过在线接口测试"
          fi

  task-tests:
    name: 任务端测试
    needs: detect
    if: needs.detect.outputs.task == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: task

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: task/go.sum

      - name: Go 代码检查
        run: go vet ./...

      - name: Go 单元测试
        run: go test ./... -v

      - name: Go 构建
        run: go build ./...

  edge-apis-tests:
    name: 边缘接口测试
    needs: detect
    if: needs.detect.outputs.edge_apis == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge/apis

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: edge/apis/go.sum

      - name: Go 代码检查
        run: go vet ./...

      - name: Go 单元测试
        run: go test ./... -v

      - name: Go 构建
        run: go build ./...

  checks:
    name: 测试通过检查
    # 无论测试 job 是跳过还是失败都运行，聚合为明确的合并门禁结论
    if: always()
    needs: [detect, server-tests, task-tests, edge-apis-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: 检查测试结果
        run: |
          results=(
            "${{ needs.detect.result }}"
            "${{ needs.server-tests.result }}"
            "${{ needs.task-tests.result }}"
            "${{ needs.edge-apis-tests.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::存在未通过的检查（$r），测试不通过不允许合并"
              exit 1
            fi
          done
          echo "全部检查通过"

      - name: 回写测试状态到 MisakaStudy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          # job context 无 name 字段、github.job_id 在配置阶段为空，改为按本步骤名反查当前 job 的 ID
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写测试状态到 MisakaStudy")) | .id' | head -1)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$JOB_ID"
          gh api -X POST \
            repos/YangRucheng/MisakaStudy/statuses/${{ github.event.client_payload.ref }} \
            -f state="$state" \
            -f context='测试通过检查（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="$RUN_URL"

          # 以 bot 风格在 PR 上发评论，引用工作流 Job 链接
          if [ -n "$PR_NUMBER" ]; then
            if [ "$state" = "success" ]; then
              summary="测试通过 ✅"
            else
              summary="测试未通过 ❌"
            fi
            body=$(printf '🤖 **MisakaStudy Runner**：%s\n\n[查看测试工作流 Job](%s)' "$summary" "$RUN_URL")
            jq -n --arg body "$body" '{body:$body}' | \
              gh api -X POST "repos/YangRucheng/MisakaStudy/issues/$PR_NUMBER/comments" --input -
          fi
