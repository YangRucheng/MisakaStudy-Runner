name: 构建镜像

# 由 MisakaStudy 仓库的 trigger.yml 通过 repository_dispatch 触发（push 事件）；
# 也可在 Runner 仓库手动触发全量构建（workflow_dispatch，默认构建全部镜像）
on:
  repository_dispatch:
    types: [misaka_push]
  workflow_dispatch:
    inputs:
      build_server:
        description: 构建并推送服务端镜像
        type: boolean
        default: true
      build_task:
        description: 构建并推送任务端镜像
        type: boolean
        default: true
      build_miniprogram:
        description: 构建并推送小程序镜像
        type: boolean
        default: true
      build_edge_apis:
        description: 构建并推送边缘接口镜像
        type: boolean
        default: true

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_server == 'true' || steps.filter.outputs.server == 'true' }}
      task: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_task == 'true' || steps.filter.outputs.task == 'true' }}
      miniprogram: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_miniprogram == 'true' || steps.filter.outputs.miniprogram == 'true' }}
      edge_apis: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_edge_apis == 'true' || steps.filter.outputs.edge_apis == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.MISAKA_PAT }}

      - name: 检测变更路径
        id: filter
        if: github.event_name == 'repository_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.client_payload.before }}
          head: ${{ github.event.client_payload.ref }}
          filters: |
            server:
              - 'server/**'
            task:
              - 'task/**'
            miniprogram:
              - 'miniprogram/**'
            edge_apis:
              - 'edge/apis/**'

  server:
    name: 构建并推送服务端镜像
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.MISAKA_PAT }}

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 生成构建参数
        id: meta
        run: |
          echo "build_time=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:server
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          # 各服务使用独立 cache scope，避免相互覆盖导致命中率下降
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  task:
    name: 构建并推送任务端镜像
    needs: detect
    if: needs.detect.outputs.task == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.MISAKA_PAT }}

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./task
          file: ./task/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:task
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=task
          cache-to: type=gha,mode=max,scope=task

  miniprogram:
    name: 构建并推送小程序镜像
    needs: detect
    if: needs.detect.outputs.miniprogram == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.MISAKA_PAT }}

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 生成构建参数
        id: meta
        run: |
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "version=v4.$(TZ=Asia/Shanghai date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./miniprogram
          file: ./miniprogram/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:miniprogram
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            TIMESTAMP=${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha,scope=miniprogram
          cache-to: type=gha,mode=max,scope=miniprogram

  edge-apis:
    name: 构建并推送边缘接口镜像
    needs: detect
    if: needs.detect.outputs.edge_apis == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: YangRucheng/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.MISAKA_PAT }}

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./edge/apis
          file: ./edge/apis/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:edge-apis
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=edge-apis
          cache-to: type=gha,mode=max,scope=edge-apis
